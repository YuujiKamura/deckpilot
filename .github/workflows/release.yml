name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Windows binary
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o deckpilot-windows-x86_64.exe .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" deckpilot-windows-x86_64.exe --title "${{ github.ref_name }}" --generate-notes
