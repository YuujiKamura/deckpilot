name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build (cross-compile for Windows)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o deckpilot.exe .

      - name: Test
        run: go test ./...
